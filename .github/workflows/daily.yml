name: Finance Daily Digest (markets + news + YouTube)

on:
  schedule:
    - cron: "0 2 * * *"  # 10:00 HKT = 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = exercise the pipeline but do NOT send email"
        required: false
        default: ""
        type: string
      hours_back:
        description: "Override look-back window (hours)"
        required: false
        default: ""
        type: string
      nlm_notebook_tag:
        description: "Suffix the NotebookLM notebook title (fresh artifact budget)"
        required: false
        default: ""
        type: string
      ignore_seen:
        description: "1 = ignore the seen-videos cache (re-analyse everything)"
        required: false
        default: ""
        type: string

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: finance-digest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gemini-webapi browser-cookie3 loguru matplotlib yfinance

      - name: Preflight — required repository secrets
        # Public repo: a forker must supply their own secrets, and a missing one
        # must fail HERE with a clear message instead of surfacing as a misleading
        # SMTP/auth error mid-run (or silently sending no digest).
        # Only secret NAMES are ever printed — never values.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
          YT_GEM_SMTP_USER: ${{ secrets.YT_GEM_SMTP_USER }}
          YT_GEM_SMTP_PASS: ${{ secrets.YT_GEM_SMTP_PASS }}
          YT_GEM_RECIPIENT: ${{ secrets.YT_GEM_RECIPIENT }}
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          missing=""
          for v in GEMINI_API_KEY YT_GEM_SMTP_USER YT_GEM_SMTP_PASS YT_GEM_RECIPIENT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$GEMINI_SID" ] || [ -z "$GEMINI_TS" ]; then
            echo "::warning::GEMINI_SID/TS not set — video half disabled, market half runs on API key"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing required repository secret(s):$missing — add them under Settings → Secrets and variables → Actions (see AGENTS.md 'Step 6: Set GitHub Secrets')."
            exit 1
          fi
          echo "required secrets present: GEMINI_API_KEY YT_GEM_SMTP_USER YT_GEM_SMTP_PASS YT_GEM_RECIPIENT (values never printed)"
          if [ -z "$NLM_STORAGE_STATE_GZ" ]; then
            echo "::warning::NLM_STORAGE_STATE_GZ not set — NotebookLM infographic will be skipped (the matplotlib chart still ships)"
          fi

      - name: Setup gemini-cli
        run: |
          mkdir -p ~/.local/bin
          cp gemini.py ~/.local/bin/gemini-cli
          chmod +x ~/.local/bin/gemini-cli

      - name: Setup auth
        env:
          GEMINI_SID: ${{ secrets.GEMINI_SID }}
          GEMINI_TS: ${{ secrets.GEMINI_TS }}
        run: |
          mkdir -p ~/.gemini-cli
          printf '{"__Secure-1PSID":"%s","__Secure-1PSIDTS":"%s"}\n' \
            "$GEMINI_SID" "$GEMINI_TS" > ~/.gemini-cli/auth.json

      - name: Setup NotebookLM session (storage state)
        env:
          NLM_STORAGE_STATE_GZ: ${{ secrets.NLM_STORAGE_STATE_GZ }}
        run: |
          mkdir -p ~/.notebooklm/profiles/default
          printf '%s' "$NLM_STORAGE_STATE_GZ" | base64 -d | gunzip > \
            ~/.notebooklm/profiles/default/storage_state.json
          python3 -c "import json;d=json.load(open('$HOME/.notebooklm/profiles/default/storage_state.json'));print('nlm cookies:',len(d.get('cookies',[])))"

      - name: Install playwright + CJK fonts (infographic download/render)
        run: |
          pip install playwright
          python3 -m playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq             fonts-noto-cjk

      - name: Restore seen-videos state
        uses: actions/cache@v4
        with:
          path: /home/runner/.hermes/yt_gem_seen.json
          # Rolling key: a fixed key always HITs, and a hit skips the save,
          # so the dedup state stays frozen and every run re-reports the
          # same videos. Unique key + prefix restore keeps it flowing.
          key: yt-gem-seen-${{ github.run_id }}
          restore-keys: yt-gem-seen-

      - name: Run digest
        env:
          # The market half's tier 1 (and the free fallback) must reach the run
          # step too — the preflight only proves they exist, it does not export
          # them. Without GEMINI_API_KEY here the digest silently downgrades to
          # the cookie tier.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_GEM_SMTP_USER: ${{ secrets.YT_GEM_SMTP_USER }}
          YT_GEM_SMTP_PASS: ${{ secrets.YT_GEM_SMTP_PASS }}
          YT_GEM_RECIPIENT: ${{ secrets.YT_GEM_RECIPIENT }}
          NOTEBOOKLM_TRANSPORT: curl_cffi
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
          YT_GEM_HOURS_BACK: ${{ github.event.inputs.hours_back }}
          NLM_NOTEBOOK_TAG: ${{ github.event.inputs.nlm_notebook_tag }}
          YT_GEM_IGNORE_SEEN: ${{ github.event.inputs.ignore_seen }}
        run: python yt_gem_daily.py

      - name: Upload digest artifacts (QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-digest-output
          path: |
            ~/.hermes/digest_images/ytgem/chart_*.png
            ~/.hermes/digest_images/ytgem/nlm_*.png
            ~/.hermes/finance_daily/chart_*.png
            /tmp/yt_digest_email.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarize serving path
        if: always()
        run: |
          echo "market backend: $(grep -a -m1 '\[market\] briefing OK' "$HOME/.hermes/finance_daily/last_run.log" || echo unknown)"
